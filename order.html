<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заявка — Тембр</title>
  <meta name="description" content="Оставьте заявку на покупку или консультацию в магазине Тембр.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header" id="top">
    <div class="site-header__inner">
      <a class="site-header__logo" href="index.html">Тембр</a>
      <nav class="site-nav" aria-label="Основное меню">
        <ul class="site-nav__list">
          <li class="site-nav__item"><a class="site-nav__link" href="index.html">Главная</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="catalog.html">Каталог</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="product.html">Товар</a></li>
          <li class="site-nav__item"><a class="site-nav__link site-nav__link--active" href="order.html">Заявка</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="contacts.html">Контакты</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="index.html#advantages">Преимущества</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="index.html#popular">Популярное</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main class="page">
    <h1 class="section__title">Оформление заявки</h1>
    <form class="order-form order-form--page" action="#" method="post">
      <div class="order-form__field"><label class="order-form__label" for="name">Имя</label>
        <input class="order-form__input" id="name" name="name" type="text" autocomplete="name" required></div>
      <div class="order-form__field"><label class="order-form__label" for="email">E-mail</label>
        <input class="order-form__input" id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="order-form__field"><label class="order-form__label" for="phone">Телефон</label>
        <input class="order-form__input" id="phone" name="phone" type="tel" autocomplete="tel" required></div>
      <div class="order-form__field"><label class="order-form__label" for="topic">Товар или тема заявки</label>
        <select class="order-form__input" id="topic" name="topic" required>
          <option value="">Выберите…</option><option>Тембр Studio 1</option><option>Тембр Air</option>
          <option>Тембр Sport</option><option>Консультация</option></select></div>
      <div class="order-form__field"><label class="order-form__label" for="comment">Комментарий</label>
        <textarea class="order-form__input" id="comment" name="comment" rows="4"></textarea></div>
      <div class="order-form__field order-form__field--check">
        <input id="agree" name="agree" type="checkbox" required>
        <label class="order-form__label" for="agree">Согласен на обработку персональных данных</label></div>
      <div class="order-form__actions"><button class="button" type="submit">Отправить заявку</button></div>
    </form>
  </main>
  <footer class="site-footer">
    <p class="site-footer__text">© 2026 «Тембр» — учебный проект (КР №1).
      <a class="site-footer__link" href="index.html#contacts">Контакты</a></p>
  </footer>
  <a class="to-top" href="#top">Наверх</a>

</body>
</html>
